[package]
edition = "2021"
name = "vfrust"
version = "0.1.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust library for macOS Virtualization.framework VM management"
homepage = "https://github.com/onogroup/vfrust"
readme = "README.md"
keywords = [
    "macos",
    "virtualization",
    "vm",
    "apple",
    "vfkit",
]
categories = [
    "os::macos-apis",
    "virtualization",
]
