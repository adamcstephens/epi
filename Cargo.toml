[workspace]
resolver = "3"
members = ["cmd", "core", "backends/ch", "backends/vz"]

[workspace.package]
version = "0.20260901.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
nix = { version = "0.31.2", features = ["fs", "user"] }
tempfile = "3"

# Local fork of vfrust while we carry a patch exposing the serial pty path
# (needed for interactive `epi console` on macOS). Iterating in-tree; will move
# to a pinned git fork + upstream PR before this is finalized.
[patch.crates-io]
vfrust = { path = "third_party/vfrust" }
