[workspace]
resolver = "3"
members = ["cmd", "core", "backends/ch", "backends/vz"]

[workspace.package]
version = "0.8.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
nix = { version = "0.31.2", features = ["fs", "user"] }
tempfile = "3"
